name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: konak
          POSTGRES_PASSWORD: konak
          POSTGRES_DB: konak_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U konak -d konak_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://konak:konak@localhost:5432/konak_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - name: Biçim kontrolü
        run: test -z "$(gofmt -l cmd internal)"
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend
      - name: Derleme
        run: go build ./...
      - name: Testler
        run: go test -race -short -count=1 -coverpkg=./internal/... -coverprofile=coverage.out ./internal/...
      - name: Kapsama raporu
        run: |
          go tool cover -func=coverage.out | tail -1
          sh ../scripts/coverage-gate.sh coverage.out | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.out

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Konteyner imajları
        run: |
          cp .env.example .env
          docker compose build
      - name: Uçtan uca doğrulama
        run: make verify
      - name: Günlükler
        if: failure()
        run: docker compose logs --tail 100
