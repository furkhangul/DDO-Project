openapi: 3.0.3
info:
  title: KonakPro API
  version: 1.0.0
  description: Otel yönetim sistemi API'si. Tüm tutarlar kuruş cinsinden tam sayıdır. Hatalar ortak Error biçimindedir.
servers:
  - url: http://localhost:8080/api/v1
security:
  - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    channelSignature:
      type: apiKey
      in: header
      name: X-Channel-Signature
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
  responses:
    Error:
      description: Hata
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: SOLD_OUT
            message:
              type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    StayRequest:
      type: object
      required: [room_type_id, rate_plan_id, check_in, check_out, adults]
      properties:
        room_type_id:
          type: integer
        rate_plan_id:
          type: integer
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
        adults:
          type: integer
        children_ages:
          type: array
          items:
            type: integer
        codes:
          type: array
          items:
            type: string
    ReservationRequest:
      allOf:
        - $ref: "#/components/schemas/StayRequest"
        - type: object
          properties:
            guest_id:
              type: integer
            guest:
              type: object
              properties:
                full_name:
                  type: string
                email:
                  type: string
                phone:
                  type: string
            pref_floor:
              type: integer
            pref_view:
              type: string
              enum: [deniz, bahce, sehir]
            adjacent_group:
              type: string
            quote_hash:
              type: string
    PaymentRequest:
      type: object
      required: [amount_kurus, method]
      properties:
        amount_kurus:
          type: integer
        method:
          type: string
          enum: [nakit, kart, havale]
    ChargeRequest:
      type: object
      required: [amount_kurus, description]
      properties:
        amount_kurus:
          type: integer
        description:
          type: string
    RefundRequest:
      type: object
      required: [payment_line_id, amount_kurus]
      properties:
        payment_line_id:
          type: integer
        amount_kurus:
          type: integer
    SplitRequest:
      type: object
      properties:
        target_folio_id:
          type: integer
        payer_type:
          type: string
          enum: [guest, company]
        payer_name:
          type: string
        line_ids:
          type: array
          items:
            type: integer
        amount_kurus:
          type: integer
        percent:
          type: integer
    WalkRequest:
      type: object
      required: [partner_hotel_id, reason]
      properties:
        partner_hotel_id:
          type: integer
        reason:
          type: string
    SolveRequest:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        apply:
          type: boolean
    ChannelEvent:
      type: object
      required: [event_id, external_ref, seq, type]
      properties:
        event_id:
          type: string
        external_ref:
          type: string
        seq:
          type: integer
        type:
          type: string
          enum: [create, modify, cancel]
        room_type:
          type: string
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date
        adults:
          type: integer
        guest_name:
          type: string
        net_kurus:
          type: integer
